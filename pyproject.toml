[project]
name = "visat"
version = "0.1.0"
description = "VISAT: Kochi Heat Action Planner — HackMe'26 PS1"
requires-python = ">=3.12"
dependencies = [
    "earthengine-api",
    "geemap",
    "xgboost",
    "shap",
    "scikit-learn",
    "pandas",
    "pyarrow",
    "numpy",
    "scipy",
    "geopandas",
    "osmnx>=2.1",
    "networkx",
    "streamlit",
    "pydeck",
    "shapely",
    "requests",
    "pythermalcomfort",
]

[project.optional-dependencies]
tier3 = ["anthropic", "streamlit-image-comparison"]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/visat"]
