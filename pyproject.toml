[project]
name = "visat"
version = "0.1.0"
description = "VISAT: Kochi Heat Action Planner — HackMe'26 PS1 (Urban Heat Mitigation via AI/ML)"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "scipy",
    "scikit-learn",
    "xgboost",
    "streamlit>=1.40",
    "pydeck",
    "requests",
    "pillow",
    "shapely",
]

[project.optional-dependencies]
pipeline = [
    "earthengine-api",
    "osmnx",
    "rasterio",
]
reactions = [
    "anthropic",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/visat"]
