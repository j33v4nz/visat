<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;background:#080b09;color:#efeee7;font:11px Consolas,"Noto Sans Malayalam",monospace}
.scene{border:1px solid #39443e;position:relative;height:435px;overflow:hidden}
header{position:absolute;top:14px;left:14px;right:14px;pointer-events:none;z-index:2}
.eyebrow{font-size:9px;color:#93a49a;letter-spacing:1px}h3{font-size:15px;margin:7px 0;color:#f2f1eb;font-weight:500}
#status{color:#70d9b3;font-size:9px}canvas{width:100%;height:330px;display:block;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}
footer{padding:0 14px}nav{display:flex;gap:8px;align-items:center;margin-bottom:12px}
button{background:#101712;color:#efeee7;border:1px solid #46564b;font:inherit;padding:7px 11px;cursor:pointer}
button:hover,button:focus-visible{border-color:#ff7627;color:#ffac79}#hint{margin-left:auto;color:#9aaba0;font-size:9px}
input{width:100%;accent-color:#70d9b3;margin:0;cursor:pointer}.legend{display:flex;justify-content:space-between;color:#aab8b0;margin-top:8px;font-size:9px}
.legend i{display:inline-block;width:7px;height:7px;margin-right:4px;background:#70d9b3}.legend span:last-child i{background:#dc713c}
@media(max-width:360px){#hint{max-width:65px}button{padding:7px 8px}}
</style></head><body><div class="scene">
<header><div class="eyebrow" id="kind"></div><h3 id="title"></h3><div id="status" role="status" aria-live="polite"></div></header>
<canvas id="city" role="img" aria-label="Interactive illustrative three-dimensional neighbourhood"></canvas>
<footer><nav><button id="before"></button><button id="after"></button><button id="replay"></button><span id="hint"></span></nav>
<input id="progress" type="range" min="0" max="100" value="0"><div class="legend"><span id="cool"></span><span id="warm"></span></div></footer>
</div><script>
const scenario=__SCENARIO__;
document.documentElement.lang=scenario.language;
const $=id=>document.getElementById(id), labels=scenario.labels;
for(const id of ['before','after','replay']) $(id).textContent=labels[id];
$('kind').textContent=labels.schematic;$('title').textContent=scenario.ward+' / '+scenario.fixLabel;
$('hint').textContent=labels.rotate;$('progress').setAttribute('aria-label',labels.progress);
for(const id of ['cool','warm']) {const swatch=document.createElement('i');$(id).append(swatch,document.createTextNode(labels[id]));}
const canvas=$('city'),ctx=canvas.getContext('2d');
let w=480,h=330,angle=-0.12,progress=0,frame=0,start=0,drag=null;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const tree=/trees|tree strip|Mangrove/.test(scenario.fix),roof=/roofs/.test(scenario.fix),green=scenario.fix==='Green roofs';
const water=/Pond|IURWTS/.test(scenario.fix),pavement=/pavements/.test(scenario.fix);
const mix=(a,b,t)=>a.map((v,i)=>Math.round(v+(b[i]-v)*Math.max(0,Math.min(1,t))));
const rgb=c=>'rgb('+c.join(',')+')';
function project(x,y,z=0){const a=x*Math.cos(angle)-y*Math.sin(angle),b=x*Math.sin(angle)+y*Math.cos(angle);const s=Math.min(w/20,27);return [w/2+(a-b)*s,203+(a+b)*s*.46-z*s];}
function polygon(points,fill,stroke='#34433a'){ctx.beginPath();points.forEach((v,i)=>{const p=project(...v);i?ctx.lineTo(...p):ctx.moveTo(...p)});ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=.6;ctx.stroke();}}
function block(x,y,z,top){const d=.67;polygon([[x,y,0],[x+d,y,0],[x+d,y,z],[x,y,z]],'#253b32');polygon([[x+d,y,0],[x+d,y+d,0],[x+d,y+d,z],[x+d,y,z]],'#17271f');polygon([[x,y,z],[x+d,y,z],[x+d,y+d,z],[x,y+d,z]],top);}
function plant(x,y,p){const pt=project(x,y,.6*p),base=project(x,y,0);ctx.strokeStyle='#a1ac83';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(...base);ctx.lineTo(...pt);ctx.stroke();ctx.fillStyle='#4baf83';ctx.beginPath();ctx.ellipse(pt[0],pt[1],Math.min(w/70,7)*p,Math.min(w/65,8)*p,0,0,Math.PI*2);ctx.fill();}
function draw(){ctx.clearRect(0,0,w,h);polygon([[-4.7,-4.7,0],[4.7,-4.7,0],[4.7,4.7,0],[-4.7,4.7,0]],'#102019');
 const weather=Math.max(-1,Math.min(1,scenario.weather/4))*progress;
 const heat=mix([118,67,41],[205,105,54],Math.max(0,Math.min(1,(scenario.anomaly+2)/6+weather*.25)));
 const cooling=Math.min(.75,Math.abs(scenario.treatment)/3)*progress;
 for(let x=-4;x<4;x++)for(let y=-4;y<4;y++){
   const tint=mix(heat,[46,107,82],cooling*((x+y)%3===0?1:.45));
   polygon([[x,y,0],[x+.94,y,0],[x+.94,y+.94,0],[x,y+.94,0]],rgb(tint),'#283b30');
 }
 polygon([[-4.3,-.32,.02],[4.3,-.32,.02],[4.3,.32,.02],[-4.3,.32,.02]],pavement?rgb(mix([55,58,52],[145,161,145],progress)):'#333b34');
 polygon([[-.32,-4.3,.025],[.32,-4.3,.025],[.32,4.3,.025],[-.32,4.3,.025]],'#333b34');
 if(water&&progress>0){ctx.globalAlpha=progress;polygon([[-3.8,1,.035],[-1.2,1,.035],[-1.2,3.8,.035],[-3.8,3.8,.035]],'#367c8a','#77b7b5');ctx.globalAlpha=1;}
 const objects=[];
 for(let x=-3.8;x<4;x+=1.45)for(let y=-3.8;y<4;y+=1.45){if(Math.abs(x)<.65||Math.abs(y)<.65||(water&&x<-.5&&y>.5))continue;objects.push({x,y,z: .65+((Math.round((x+4)*10)+Math.round((y+4)*13))%9)/8});}
 objects.sort((a,b)=>project(a.x,a.y)[1]-project(b.x,b.y)[1]);
 for(const b of objects){block(b.x,b.y,b.z,roof?rgb(mix([166,117,77],green?[73,156,104]:[216,225,205],progress)):rgb(mix([166,117,77],[94,133,104],cooling)));if(tree&&progress>0)plant(b.x+.95,b.y+.7,progress);}
 for(let i=0;i<4;i++)plant(3.9,-3+i*1.7,.7);
 $('progress').value=Math.round(progress*100);$('status').textContent=progress>=1?labels.ready:labels.playing+' / '+Math.round(progress*100)+'%';
 canvas.dataset.progress=String(progress);canvas.dataset.treatment=scenario.fix;
}
function resize(){w=canvas.clientWidth;const d=Math.min(devicePixelRatio||1,2);canvas.width=w*d;canvas.height=h*d;ctx.setTransform(d,0,0,d,0,0);draw();}
function stop(){cancelAnimationFrame(frame);frame=0;}
function animate(now){if(!start)start=now;progress=Math.min(1,(now-start)/2600);draw();if(progress<1)frame=requestAnimationFrame(animate);}
function play(){stop();start=0;if(reduced){progress=1;draw();return;}progress=0;frame=requestAnimationFrame(animate);}
$('before').onclick=()=>{stop();progress=0;draw();$('status').textContent=labels.before;};
$('after').onclick=()=>{stop();progress=1;draw();};$('replay').onclick=play;
$('progress').oninput=e=>{stop();progress=Number(e.target.value)/100;draw();};
canvas.onpointerdown=e=>{drag=e.clientX;canvas.setPointerCapture(e.pointerId);};
canvas.onpointermove=e=>{if(drag===null)return;angle+=(e.clientX-drag)*.006;drag=e.clientX;draw();};
canvas.onpointerup=canvas.onpointercancel=()=>{drag=null;};
new ResizeObserver(resize).observe(canvas);resize();play();
</script></body></html>
